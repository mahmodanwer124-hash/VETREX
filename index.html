<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VETREX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Chakra+Petch:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: dark single-look. Landing (hero with animated graph canvas, flow, role cards) + auth + app shell (right sidebar, content) for marketer and merchant. */
:root{color-scheme:dark;
  --bg:#0A0B0C;--bg2:#0F1113;--surface:#14171A;--surface2:#1B1F23;--line:#2A3035;--line2:#3A4147;
  --metal:#9AA3AB;--ink:#F2F4F5;--red:#C8202C;--red-hi:#F0505B;--red-deep:#4A0D13;
  --good:#3DCB8A;--warn:#F2B84B;--blue:#6AA4FF;--good-t:#3DCB8A;--warn-t:#F2B84B;--acc:#F0505B;--acc2:#FF7A83;
  --f-ar:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-disp:'Cairo','Tajawal',system-ui,sans-serif;
  --f-lat:'Chakra Petch','Tajawal',system-ui,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--f-ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-lat);letter-spacing:.04em}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{overflow-x:auto;max-width:100%}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:11px 22px;font-weight:600;border:1px solid transparent;text-decoration:none;background:var(--surface2);color:var(--ink);line-height:1.4}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#DA2B38}
.btn.line{background:transparent;border-color:var(--line2)}
.btn.line:hover{border-color:var(--metal)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.big{padding:14px 28px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);width:40px;height:40px;display:grid;place-items:center}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;color:var(--metal);font-weight:500}
.f>span i{color:var(--red-hi);font-style:normal;margin-inline-start:4px}
.f small{color:var(--metal);font-size:12px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--red-hi);outline:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
input[type=file]{padding:8px}
textarea{resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--metal) 50%),linear-gradient(135deg,var(--metal) 50%,transparent 50%);background-position:calc(0% + 18px) 52%,calc(0% + 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .wide{grid-column:1/-1}
.err{color:var(--red-hi);font-size:13px;min-height:1.3em}
.chk{display:flex;align-items:center;gap:10px}

/* landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,11,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.logo b{font-family:var(--f-lat);font-weight:800;font-size:20px;letter-spacing:.12em}
.logo b em{color:var(--red-hi);font-style:normal}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 12px;color:var(--metal);text-decoration:none;border-radius:var(--r);font-weight:500;cursor:pointer}
.nav-links a:hover{color:var(--ink)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding-block:64px 72px}
.eyebrow{font-family:var(--f-lat);font-size:12px;letter-spacing:.32em;color:var(--red-hi);font-weight:700}
.hero h1{font-size:clamp(34px,5.6vw,64px);margin-top:14px;line-height:1.2}
.hero h1 span{color:var(--red-hi)}
.hero .lead{color:var(--metal);font-size:18px;margin-top:18px;max-width:30em}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .tag{margin-top:20px;color:var(--metal);font-size:14px}
.vis{position:relative;min-width:0}
.vis img{display:block;width:100%;height:auto;border-radius:var(--r);-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%)}
.vis::before{content:"";position:absolute;inset:12% 18%;background:radial-gradient(circle,rgba(200,32,44,.38),transparent 68%);filter:blur(20px)}
.fc{position:absolute;background:rgba(20,23,26,.92);border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;min-width:132px;backdrop-filter:blur(6px);animation:flt 7s ease-in-out infinite}
.fc small{display:block;color:var(--metal);font-size:12px}
.fc b{font-family:var(--f-lat);font-size:19px}
.fc b.up{color:var(--good-t)}
.fc em{display:inline-block;font-style:normal;font-size:10.5px;border:1px dashed var(--line2);border-radius:99px;padding:0 8px;color:var(--metal);margin-top:2px}
.fc svg{display:block;width:100%;height:24px;margin-top:4px}
.fc path{fill:none;stroke:var(--red-hi);stroke-width:2;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:dr 2.4s .4s ease forwards}
.fc1{top:0;inset-inline-start:-2%}
.fc2{top:4%;inset-inline-end:-2%;animation-delay:-2s}
.fc3{bottom:-14%;inset-inline-end:22%;animation-delay:-4s}
@keyframes flt{50%{transform:translateY(-8px)}}
@keyframes dr{to{stroke-dashoffset:0}}
section.sec{padding-block:72px}
.sec-h{max-width:640px;margin-bottom:32px}
.sec-h h2{font-size:clamp(26px,3.6vw,38px)}
.sec-h p{color:var(--metal);margin-top:10px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.flow>div{position:relative;padding:20px 18px 22px;border:1px solid var(--line);background:var(--surface);margin-inline-start:-1px}
.flow>div:first-child{border-start-start-radius:var(--r);border-end-start-radius:var(--r);margin-inline-start:0}
.flow>div:last-child{border-start-end-radius:var(--r);border-end-end-radius:var(--r)}
.flow b{font-family:var(--f-lat);color:var(--red-hi);font-size:13px;letter-spacing:.2em}
.flow h3{font-size:18px;margin:8px 0 6px}
.flow p{color:var(--metal);font-size:14px}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.role.hot{border-color:var(--red);background:linear-gradient(180deg,rgba(200,32,44,.12),var(--surface) 55%)}
.role h3{font-size:26px}
.role ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--metal)}
.role li{padding-inline-start:20px;position:relative}
.role li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:8px;height:2px;background:var(--red-hi)}
.role .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.sec2{background:var(--bg2);border-block:1px solid var(--line)}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.layer{border-top:2px solid var(--red);padding:14px 0 0;min-width:0}
.layer h4{font-size:16px}
.layer p{color:var(--metal);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:6px 16px;color:var(--metal);background:transparent;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta-band{background:linear-gradient(120deg,var(--red-deep),var(--bg2) 70%);border:1px solid var(--line);border-radius:var(--r);padding:40px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer.ft{border-top:1px solid var(--line);padding-block:28px;color:var(--metal);font-size:13px}
footer.ft .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.auth-side{background:radial-gradient(circle at 30% 30%,#2a0a0e,var(--bg) 70%);padding:40px max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:20px;border-inline-end:1px solid var(--line)}
.auth-side p{color:var(--metal);max-width:26em}
.auth-main{padding:40px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:560px;display:grid;gap:18px}
.auth-card h1{font-size:30px}
.auth-card .sub{color:var(--metal)}
.alt{color:var(--metal);font-size:14px}
.alt a{color:var(--red-hi);font-weight:600;text-decoration:none}
.demo{border:1px dashed var(--line2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--metal);font-size:14px}

/* app shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--bg2);border-inline-end:1px solid var(--line);padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;overflow:auto}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.sbrand b{font-family:var(--f-lat);font-weight:800;letter-spacing:.12em;display:block;line-height:1.2}
.sbrand small{font-family:var(--f-lat);font-size:10px;letter-spacing:.24em;color:var(--red-hi)}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--metal);text-decoration:none;font-weight:500}
.side nav a:hover{background:var(--surface);color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--surface2);color:var(--ink);box-shadow:inset -3px 0 0 var(--red)}
.side nav a .bd{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding-inline:6px}
.suser{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px;font-size:14px}
.suser small{color:var(--metal)}
.suser .btn{margin-top:8px}
.main{min-width:0}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;background:rgba(10,11,12,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:64px;padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tbar h1{font-size:22px;margin-inline-end:auto}
.tbar .logo{margin-inline-end:0}
.tbar .menu{display:none}
.content{padding-block:24px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:24px;max-width:1180px}
.scrim{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:18px;margin-bottom:12px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card .hd h3{margin:0}
.grp{display:grid;gap:10px}
.grp>h4{font-size:14px;color:var(--metal);font-family:var(--f-ar);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats[data-c="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats[data-c="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats[data-c="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats[data-c="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.st small{display:block;color:var(--metal);font-size:13px}
.st b{font-family:var(--f-lat);font-size:22px;font-weight:700;display:block;margin-top:2px;overflow-wrap:anywhere}
.st b small{display:inline;font-family:var(--f-ar);font-size:12px;color:var(--metal);font-weight:400}
.st.red{border-color:var(--red);background:linear-gradient(180deg,rgba(200,32,44,.16),var(--surface))}
.st.good b{color:var(--good-t)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line2);color:var(--metal);border-radius:var(--r);padding:4px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--metal);font-size:11px;font-family:var(--f-lat)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--red-hi);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--bg);stroke:var(--red-hi);stroke-width:2}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;color:var(--metal);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.7}
.p-received,.p-pending,.p-confirming{color:var(--warn-t)}
.p-prepared,.p-out{color:var(--blue)}
.p-delivered,.p-published,.p-approved,.p-excellent{color:var(--good-t)}
.p-rejected,.p-returned,.p-low{color:var(--red-hi)}
.p-draft,.p-inactive{color:var(--metal)}
.p-good{color:var(--warn-t)}
.tile{border-radius:var(--r);background:var(--surface2);display:grid;place-items:center;color:var(--red-hi);overflow:hidden;aspect-ratio:4/3;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ic{width:36px;height:36px}
.tile.s{width:48px;aspect-ratio:1;flex:none}
.tile.s .ic{width:22px;height:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
.pc:hover{border-color:var(--line2)}
.pc h3{font-family:var(--f-ar);font-size:15px;font-weight:600}
.pc .cat{color:var(--metal);font-size:12px}
.pc .pr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.pc .pr div{background:var(--bg2);border-radius:var(--r);padding:4px 10px}
.pc .pr small{display:block;font-size:11px;color:var(--metal)}
.pc .pr b{font-size:14px}
.pc .pr .gn b{color:var(--good-t)}
.score{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-lat);font-weight:700;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .f{min-width:150px;flex:1}
.pd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--metal)}.kv dd{margin:0}
.sum{display:grid;gap:8px}
.sum .r{display:flex;justify-content:space-between;gap:12px}
.sum .r.t{border-top:1px dashed var(--line2);padding-top:8px;font-weight:700}
.sum .r.g{background:rgba(61,203,138,.12);color:var(--good-t);border-radius:var(--r);padding:8px 12px;font-weight:700}
.ord{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord .m{color:var(--metal);font-size:13px}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 24px 16px 0;color:var(--metal)}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--red-hi)}
.tl li::after{content:"";position:absolute;inset-inline-start:4px;top:18px;bottom:-6px;width:2px;background:var(--line2)}
.tl li:last-child::after{display:none}
.tl li b{color:var(--ink);display:block}
.empty{color:var(--metal);text-align:center;padding:36px 12px}
.note{background:rgba(242,184,75,.1);border:1px solid rgba(242,184,75,.35);color:var(--warn-t);border-radius:var(--r);padding:12px 16px;font-size:14px}
.note.info{background:rgba(106,164,255,.08);border-color:rgba(106,164,255,.3);color:var(--blue)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.mbox .hd{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;place-items:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.code{font-family:var(--f-lat);font-weight:700;letter-spacing:.1em;background:var(--bg2);border:1px dashed var(--line2);border-radius:var(--r);padding:8px 14px;display:inline-block}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.inl{display:flex;gap:8px;align-items:center}
.inl input{width:80px}

/* landing v2 */
.mut{color:var(--metal)}
.hero h1 span{color:var(--red-hi);background:linear-gradient(90deg,#FF7A83,#C8202C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.trust{display:flex;gap:18px;flex-wrap:wrap;list-style:none;margin:26px 0 0;padding:0;color:var(--metal);font-size:14px}
.trust li{display:flex;align-items:center;gap:8px}
.trust li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(61,203,138,.18)}
.vis2{position:relative;min-width:0;display:grid;gap:0}
.vis2 .lg{display:block;width:100%;height:auto;border-radius:var(--r);-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%)}
.vis2::before{content:"";position:absolute;inset:0 10% 30%;background:radial-gradient(circle,rgba(200,32,44,.4),transparent 68%);filter:blur(24px)}
.gl{background:linear-gradient(160deg,rgba(32,36,40,.94),rgba(15,17,19,.94));border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 30px 80px -30px rgba(200,32,44,.55),inset 0 0 0 1px rgba(255,255,255,.03);backdrop-filter:blur(8px)}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:0})}
function egp(v){return '<span class="num">'+n(v)+'</span> ج.م'}
function pct(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:1})+'%'}
function dfmt(ts){return new Date(ts).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short',year:'numeric'})}
function dtfmt(ts){return new Date(ts).toLocaleString('ar-EG-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sod(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function digits(s){return String(s||'').replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)}).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776)})}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(m){var t=document.createElement('div');t.className='toast';t.innerHTML='<div>'+esc(m)+'</div>';document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}

/* ---------- domain helpers ---------- */
function me(){return db.users.filter(function(u){return u.id===db.session})[0]||null}
function prod(id){return db.products.filter(function(p){return p.id===+id})[0]}
function oGross(o){return (o.price-o.cost)*o.qty}
function oFee(o){return Math.max(0,oGross(o))*(o.fee||0)}
function oProfit(o){return oGross(o)-oFee(o)}
function oMarkup(o){return (o.cost-(o.mcost!=null?o.mcost:o.cost))*o.qty}
function oPlat(o){return oMarkup(o)+oFee(o)}
function mrate(id){var u=db.users.filter(function(x){return x.id===id})[0];return u&&u.rate!=null&&u.rate!==''?+u.rate:db.settings.markup}
function frate(id){var u=db.users.filter(function(x){return x.id===id})[0];return u&&u.fee!=null&&u.fee!==''?+u.fee:db.settings.adminFee}
function mkcOf(v,r){return Math.round(v*(1+(r==null?db.settings.markup:r)))}
function mkc(p){return mkcOf(p.cost,mrate(p.mc))}
function updMk(){var c=$('#cost'),m=$('#mkprev');if(!c||!m)return;var v=parseInt(digits(c.value),10)||0;m.textContent=v?'← يظهر للمسوق بسعر '+n(mkcOf(v,mrate(db.session)))+' ج.م (بعد إضافة '+pct(mrate(db.session)*100)+' تلقائيًا)':''}
function oSales(o){return o.price*o.qty}
function cmSt(o){return o.cm&&o.cm.recv?'recv':(o.cm&&o.cm.sent?'sent':'due')}
function cmVis(o){return !(o.cm&&o.cm.recv&&Date.now()-o.cm.recv>2*DAY)}
function cmPill(o){var k=cmSt(o);return k==='recv'?pill('published','تم الاستلام'):k==='sent'?pill('pending','أُرسلت · بانتظار تأكيد الإدارة'):pill('rejected','لم تُسدَّد')}
function oOwe(o){return oMarkup(o)+oGross(o)}
function oPct(o){var s0=db.settings.markup*100;if(!o.mcost)return Math.round(s0);var p=(o.cost/o.mcost-1)*100;return Math.abs(p-s0)<1.6?Math.round(s0):Math.round(p)}
function oDue(o){return (o.mcost!=null?o.mcost:o.cost)*o.qty}
function lastTs(o){return o.hist[o.hist.length-1].ts}
function reserved(p){return db.orders.filter(function(o){return o.pid===p.id&&ACTIVE.indexOf(o.status)>-1}).reduce(function(a,o){return a+o.qty},0)}
function avail(p){return Math.max(0,p.stock-reserved(p))}
function notify(uid,text){db.notifs.push({id:db.seq.notif++,uid:uid,ts:Date.now(),text:text,read:false})}
function nameById(id){var u=db.users.filter(function(x){return x.id===id})[0];return u?u.name:''}

function pStats(p){
  var os=db.orders.filter(function(o){return o.pid===p.id});
  var del=os.filter(function(o){return o.status==='delivered'}),rej=os.filter(function(o){return o.status==='rejected'}),ret=os.filter(function(o){return o.status==='returned'});
  var fin=del.length+rej.length+ret.length,o30=os.filter(function(o){return o.ts>Date.now()-30*DAY}).length,av=avail(p);
  var delivery=fin?del.length/fin:.8,margin=(p.sug-mkc(p))/mkc(p);
  var score=Math.round(clamp(.3*Math.min(100,30+o30*5)+.3*Math.min(100,margin*200)+.2*Math.min(100,av*4)+.2*delivery*100,0,100));
  return {orders:os.length,delivered:del.length,rejected:rej.length,returned:ret.length,views:p.views||0,conv:p.views?os.length/p.views:0,sales:del.reduce(function(a,o){return a+oDue(o)},0),score:score,av:av,o30:o30,delivery:delivery};
}
function scoreTier(s){return s>=80?['excellent','ممتاز']:s>=60?['good','جيد']:['low','منخفض']}

function scoreBadge(s){var t=scoreTier(s);return '<span class="score p-'+t[0]+'" title="VETREX SCORE">'+ring(s)+'<span>VETREX Score · '+t[1]+'</span></span>'}

function checkLow(p){
  var a=avail(p);
  if(a<=lowT()&&p.status==='published'){
    if(!p.lowSince){p.lowSince=Date.now();if(db.settings.nLow)notify(p.mc,'مخزون «'+p.name+'» منخفض ('+n(a)+' وحدات). عندك '+lowD()+' أيام للتعبئة قبل إيقاف المنتج.')}
  }else if(a>lowT()&&p.lowSince){p.lowSince=null}
}
function sweep(){
  var ch=false;
  db.products.forEach(function(p){
    if(p.lowSince&&p.status==='published'&&Date.now()-p.lowSince>lowD()*DAY){p.status='inactive';p.lowSince=null;notify(p.mc,'تم إيقاف «'+p.name+'» لانخفاض المخزون أكثر من '+lowD()+' أيام.');ch=true}
  });
  if(ch)save();
}

function periods(list,valFn,tsFn){
  var now=Date.now(),s=sod(now),d=new Date(now),ms=new Date(d.getFullYear(),d.getMonth(),1).getTime(),pms=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();
  var r={today:0,yesterday:0,week:0,month:0,prev:0,total:0};
  list.forEach(function(o){var t=tsFn(o),v=valFn(o);r.total+=v;
    if(t>=s)r.today+=v;else if(t>=s-DAY)r.yesterday+=v;
    if(t>=now-7*DAY)r.week+=v;
    if(t>=ms)r.month+=v;else if(t>=pms)r.prev+=v});
  return r;
}
function countBy(os,sts){return os.filter(function(o){return sts.indexOf(o.status)>-1}).length}
function rates(os){var d=countBy(os,['delivered']),r=countBy(os,['rejected']),t=countBy(os,['returned']),f=d+r+t;return {del:f?d/f*100:0,rej:f?r/f*100:0,ret:f?t/f*100:0}}

function walletOf(u){
  var tx=[],pending=0,earn=0,out=0;
  if(u.role==='marketer'){
    db.orders.filter(function(o){return o.mk===u.id}).forEach(function(o){
      if(o.status==='delivered'){earn+=oProfit(o);tx.push({id:'TX-'+o.id.slice(3),ts:lastTs(o),type:'Credit',label:'ربح الطلب '+o.id,amt:oProfit(o)})}
      else if(ACTIVE.indexOf(o.status)>-1)pending+=oProfit(o)});
    var rf=db.users.filter(function(x){return x.ref===u.code}).map(function(x){return x.id});
    db.orders.filter(function(o){return rf.indexOf(o.mk)>-1&&o.status==='delivered'}).forEach(function(o){var c=oProfit(o)*rr(o);earn+=c;tx.push({id:'TR-'+o.id.slice(3),ts:lastTs(o),type:'Referral',label:'عمولة إحالة من الطلب '+o.id,amt:c})});
  }else{
    db.orders.filter(function(o){return o.mc===u.id}).forEach(function(o){
      if(o.status==='delivered'){earn+=oOwe(o);tx.push({id:'TX-'+o.id.slice(3),ts:lastTs(o),type:'Due',label:'مستحق للمنصة عن الطلب '+o.id,amt:-oOwe(o)});if(cmSt(o)==='recv'){out+=oOwe(o);tx.push({id:'CM-'+o.id.slice(3),ts:o.cm.recv,type:'Settlement',label:'استلام عمولة الطلب '+o.id,amt:oOwe(o)})}}
      else if(ACTIVE.indexOf(o.status)>-1)pending+=oOwe(o)});
  }
  db.adjust.filter(function(a){return a.uid===u.id}).forEach(function(a){earn+=(u.role==='merchant'?-a.amt:a.amt);tx.push({id:a.id,ts:a.ts,type:'Adjustment',label:(a.chk?'مكافأة تحدي: ':'تعديل إداري: ')+a.reason,amt:a.amt})});
  db.withdrawals.filter(function(w){return w.uid===u.id}).forEach(function(w){if(w.status!=='rejected'){out+=w.amt;tx.push({id:w.id,ts:w.ts,type:'Withdrawal',label:'طلب سحب ('+WST[w.status]+')',amt:-w.amt})}});
  tx.sort(function(a,b){return b.ts-a.ts});
  return {available:Math.max(0,earn-out),pending:pending,total:earn,tx:tx};
}

  else if(o.type==='textarea')inner='<textarea id="'+id+'" name="'+id+'" rows="'+(o.rows||3)+'" placeholder="'+esc(o.ph||'')+'">'+esc(v)+'</textarea>';

}

/* animated graph background */
function startBg(){
  cancelAnimationFrame(bgRaf);
  var cv=$('#bg');if(!cv)return;
  var ctx=cv.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,w=0,h=0;
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
  size();
  var P=[];for(var i=0;i<44;i++)P.push({x:Math.random(),y:Math.random(),s:.00005+Math.random()*.00012,r:.6+Math.random()*1.4});
  function draw(t){
    if(!cv.isConnected)return;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
    for(var x=0;x<w;x+=72){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(var y=0;y<h;y+=72){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    for(var k=0;k<3;k++){
      ctx.beginPath();
      for(var i=0;i<=70;i++){var p=i/70,X=p*w,Y=h*(.88-.07*k)-p*h*(.46+.07*k)+Math.sin(p*9+k*2+t/1900)*h*.035+Math.sin(p*23+t/1300+k)*h*.012;if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y)}
      ctx.strokeStyle=k===0?'rgba(240,80,91,.5)':'rgba(154,163,171,.16)';ctx.lineWidth=k===0?2:1;ctx.stroke();
    }
    ctx.fillStyle='rgba(240,80,91,.55)';
    P.forEach(function(q){q.y-=q.s*16;if(q.y<0){q.y=1;q.x=Math.random()}ctx.beginPath();ctx.arc(q.x*w,q.y*h,q.r,0,6.3);ctx.fill()});
    if(!rm)bgRaf=requestAnimationFrame(draw);
  }
  draw(0);
  window.addEventListener('resize',function(){if(cv.isConnected){size();if(rm)draw(0)}});
}

async function hashPw(p,salt){
  try{var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    var b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256);
    return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){return 'x'+btoa(unescape(encodeURIComponent(salt+p)))}
}
function setErr(m){var e=$('#err');if(e)e.textContent=m||''}
function phoneOk(p){return /^01[0125]\d{8}$/.test(p)}
function emailOk(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function pwOk(p){return p.length>=8&&/[A-Za-z؀-ۿ]/.test(p)&&/\d/.test(p)}
function fdata(f){var o={};new FormData(f).forEach(function(v,k){o[k]=typeof v==='string'?v.trim():v});return o}

async function doLogin(role,f){
  var d=fdata(f),email=d.email.toLowerCase();
  var L=db.lock[email]||{n:0,until:0};
  if(L.until>Date.now()){return setErr('محاولات كثيرة. انتظر '+Math.ceil((L.until-Date.now())/1000)+' ثانية ثم حاول مرة أخرى.')}
  var u=db.users.filter(function(x){return x.email===email&&x.role===role})[0];
  var ok=false;
  if(u&&u.hash){ok=(await hashPw(d.pw,u.salt))===u.hash}
  if(!ok){L.n++;if(L.n>=db.settings.maxTries){L.until=Date.now()+db.settings.lockSec*1000;L.n=0}db.lock[email]=L;secLog(email,role,false,'بيانات دخول خاطئة');save();return setErr('البريد أو كلمة المرور غير صحيحة.')}
  if(blocked(u)){secLog(email,role,false,'حساب موقوف');save();return setErr('هذا الحساب موقوف.'+(u.reason?' السبب: '+u.reason:'')+' تواصل مع الدعم الفني.')}
  delete db.lock[email];db.session=u.id;secLog(email,role,true,'دخول ناجح');save();location.hash=role==='marketer'?'m-dashboard':'t-dashboard';
}
async function doRegister(role,f){
  var d=fdata(f);d.phone=digits(d.phone);d.phone2=digits(d.phone2);d.email=d.email.toLowerCase();
  if(d.name.length<3)return setErr('اكتب الاسم بالكامل.');
  if(!phoneOk(d.phone))return setErr('الهاتف الأساسي لازم يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون 11 رقم.');
  if(d.phone2&&!phoneOk(d.phone2))return setErr('رقم الهاتف الثاني غير صحيح.');
  if(!emailOk(d.email))return setErr('اكتب بريد إلكتروني صحيح.');
  if(db.users.some(function(x){return x.email===d.email}))return setErr('هذا البريد مسجل بالفعل.');
  if(!pwOk(d.pw))return setErr('كلمة المرور لازم تكون 8 أحرف على الأقل وتحتوي على حروف وأرقام.');
  if(d.pw!==d.pw2)return setErr('تأكيد كلمة المرور غير مطابق.');
  if(!d.city)return setErr('اكتب المدينة.');
  var salt=Math.random().toString(36).slice(2)+Date.now();
  var u={id:'u-'+Date.now().toString(36),role:role,name:d.name,phone:d.phone,phone2:d.phone2,email:d.email,gov:d.gov,city:d.city,salt:salt,hash:await hashPw(d.pw,salt),created:Date.now()};
  if(role==='marketer'){
    u.code='VTX-'+(1000+db.users.filter(function(x){return x.role==='marketer'}).length+58);
    u.ref=null;
    if(d.hasref){
      var r=db.users.filter(function(x){return x.role==='marketer'&&x.code===(d.ref||'').toUpperCase()})[0];
      if(!r)return setErr('كود الإحالة غير صحيح.');
      u.ref=r.code;notify(r.id,'لديك مسوق جديد من خلال كودك.');
    }
  }else{
    if(!d.store)return setErr('اكتب اسم المتجر.');
    if(!d.addr)return setErr('اكتب العنوان بالتفصيل.');
    u.wa=digits(d.wa);u.store=d.store;u.activity=d.activity;u.cat=d.cat;u.area=d.area;u.addr=d.addr;u.mark=d.mark;u.status='pending';
  }
  db.users.push(u);db.session=u.id;save();toast('تم إنشاء الحساب');
  location.hash=role==='marketer'?'m-dashboard':'t-dashboard';
}

function series(list,range,metric,role){
  var now=Date.now(),s=sod(now),nb,bm,start;
  if(range==='1'){nb=24;bm=36e5;start=s}
  else{var c={'7':[7,DAY],'30':[30,DAY],'90':[13,7*DAY],'180':[26,7*DAY],'365':[12,30.4*DAY]}[range];nb=c[0];bm=c[1];start=s+DAY-nb*bm}
  var v=[];for(var i=0;i<nb;i++)v.push(0);
  list.forEach(function(o){
    var t,val;
    if(metric==='orders'){t=o.ts;val=1}
    else{if(o.status!=='delivered')return;t=lastTs(o);val=metric==='profit'?oProfit(o):(role==='marketer'?oSales(o):oDue(o))}
    var i=Math.floor((t-start)/bm);if(i>=0&&i<nb)v[i]+=val;
  });
  return v.map(function(x,i){var d=new Date(start+i*bm);return {v:x,l:range==='1'?i+':00':d.getDate()+'/'+(d.getMonth()+1)}});
}
function niceMax(m){if(m<=0)return 4;var p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chartSvg(data,unit){
  var W=680,H=250,L=56,Rr=14,T=14,B=28,mx=niceMax(Math.max.apply(null,data.map(function(d){return d.v}))),cw=W-L-Rr,ch=H-T-B;
  var x=function(i){return L+(data.length>1?i/(data.length-1):0)*cw},y=function(v){return T+ch-v/mx*ch};
  var g='',i;
  for(i=0;i<=4;i++){var gv=mx*i/4,gy=y(gv);g+='<line class="g" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy+'" y2="'+gy+'"/><text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end">'+(gv>=1000?(gv/1000).toLocaleString('en',{maximumFractionDigits:1})+'k':Math.round(gv))+'</text>'}
  var pts=data.map(function(d,i){return x(i)+','+y(d.v)}),line='M'+pts.join(' L'),area=line+' L'+x(data.length-1)+','+(T+ch)+' L'+x(0)+','+(T+ch)+' Z';
  var lab=[0,Math.floor((data.length-1)/2),data.length-1].map(function(k){return '<text x="'+x(k)+'" y="'+(H-8)+'" text-anchor="middle">'+data[k].l+'</text>'}).join('');
  var last=data.length-1,dots=data.map(function(d,i){return '<circle cx="'+x(i)+'" cy="'+y(d.v)+'" r="9" fill="transparent"><title>'+d.l+' — '+n(d.v)+' '+unit+'</title></circle>'}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="رسم بياني"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0505B" stop-opacity=".35"/><stop offset="1" stop-color="#F0505B" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#ga)"/><path class="ln" d="'+line+'"/>'+lab+'<circle class="dt" cx="'+x(last)+'" cy="'+y(data[last].v)+'" r="5"/>'+dots+'</svg>';

/* TOTP (RFC 6238) via WebCrypto - demo secret */
function b32(s){var AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',bits='',out=[],i;s.split('').forEach(function(c){bits+=('00000'+AL.indexOf(c).toString(2)).slice(-5)});for(i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.substr(i,8),2));return new Uint8Array(out)}
async function totp(step){var c=new ArrayBuffer(8),v=new DataView(c);v.setUint32(4,step>>>0);v.setUint32(0,Math.floor(step/4294967296));var k=await crypto.subtle.importKey('raw',b32(TSECRET),{name:'HMAC',hash:'SHA-1'},false,['sign']);var h=new Uint8Array(await crypto.subtle.sign('HMAC',k,c));var o=h[19]&15,x=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000;return ('000000'+x).slice(-6)}
async function totpOk(code){if(!/^\d{6}$/.test(code))return false;var s=Math.floor(Date.now()/30000);try{for(var d=-1;d<=1;d++){if(await totp(s+d)===code)return true}}catch(e){return code==='123456'}return false}

async function doAdminLogin(f){

function adminEditSubmit(name,d,m,me0,done){
  var D=[];function ch(l,a,b){if(String(a==null?'':a)!==String(b==null?'':b))D.push(l+': '+(a==null||a===''?'—':a)+' → '+(b===''?'—':b))}

    if(db.users.some(function(x){return x.email===email&&x.id!==tu.id}))return setErr('هذا البريد مستخدم لحساب آخر.');
    if(!phoneOk(phone))return setErr('رقم الهاتف غير صحيح.');

    if(d.pw&&!pwOk(d.pw))return setErr('كلمة المرور 8 أحرف على الأقل وتحتوي على حروف وأرقام.');
    var map=[['name','الاسم',d.name],['email','البريد',email],['phone','الهاتف',phone],['gov','المحافظة',d.gov],['city','المدينة',d.city]];
    if(tu.role==='marketer')map.push(['phone2','هاتف إضافي',d.phone2],['ref','المُحيل',(d.ref||'').trim()]);
    if(tu.role==='merchant')map.push(['store','المتجر',d.store],['activity','النشاط',d.activity],['cat','القسم',d.cat],['area','المنطقة',d.area],['wa','واتساب',d.wa],['addr','العنوان',d.addr]);
    map.forEach(function(r){ch(r[1],tu[r[0]],r[2]);tu[r[0]]=r[2]});
    var rk=tu.role==='merchant'?'rate':'fee',rv=(d[rk]==null?'':String(d[rk])).trim().replace(',','.'),lim=tu.role==='merchant'?60:50;
    if(rv===''){if(tu[rk]!=null){ch('نسبة المنصة (خاصة)','مخصصة','النسبة العامة');delete tu[rk]}}
    else{var pv=parseFloat(rv);if(!(pv>=0&&pv<=lim))return setErr('النسبة من 0 إلى '+lim+'.');var fv=Math.round(pv*100)/10000;if(tu[rk]!==fv){ch('نسبة المنصة (خاصة)',tu[rk]==null?'عامة':pct(tu[rk]*100),pct(fv*100));tu[rk]=fv}}
    (async function(){
      if(d.pw){tu.salt=Math.random().toString(36).slice(2)+Date.now();tu.hash=await hashPw(d.pw,tu.salt);D.push('إعادة تعيين كلمة المرور')}

      notify(tu.id,'تم تعديل بيانات حسابك من الإدارة.');audit('user.edit','user:'+tu.id,D.join(' | '));done('تم حفظ بيانات المستخدم');
    })();

  }
  if(name==='a-orderedit'){
    if(!need('orders.manage'))return;var o=db.orders.filter(function(x){return x.id===m.id})[0];if(!o)return;
    var cu={name:d.cname,p1:digits(d.p1||'').replace(/\D/g,''),p2:digits(d.p2||'').replace(/\D/g,''),gov:d.gov,area:d.area,street:d.street,bld:d.bld,floor:d.floor,apt:d.apt,mark:d.mark,det:d.det};
    if((cu.name||'').length<2)return setErr('اكتب اسم العميل.');
    if(!phoneOk(cu.p1))return setErr('رقم هاتف العميل غير صحيح.');

    if(!(fee>=0&&fee<=1))return setErr('المصاريف الإدارية بين 0 و 100%.');
    var oldM=o.mcost!=null?o.mcost:o.cost;
    var finCh=qty!==o.qty||price!==o.price||mcost!==oldM||cost!==o.cost||Math.abs(fee-(o.fee||0))>1e-9||ship!==o.ship;
    if(finCh&&!can('finance.manage'))return setErr('تعديل المبالغ يحتاج صلاحية المالية.');
    Object.keys(cu).forEach(function(k){ch('العميل.'+k,o.cust[k],cu[k]);o.cust[k]=cu[k]});
    var p=prod(o.pid);

    ch('الكمية',o.qty,qty);ch('سعر البيع',o.price,price);ch('سعر التاجر',oldM,mcost);ch('سعر المسوّق',o.cost,cost);ch('المصاريف الإدارية',pct((o.fee||0)*100),pct(fee*100));ch('الشحن',o.ship,ship);
    o.qty=qty;o.price=price;o.mcost=mcost;o.cost=cost;o.fee=fee;o.ship=ship;
    if(d.status&&d.status!==o.status&&ST[d.status]){ch('الحالة',ST[o.status],ST[d.status]);forceStatus(o,d.status,(d.snote||'').trim(),me0.name)}

  }
  if(name==='a-prodedit'){
    if(!need('products.review'))return;var p2=prod(m.id);if(!p2)return;

    if((d.name||'').length<2)return setErr('اكتب اسم المنتج.');

    var specs=(d.specs||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
    var old=p2.stock;
    [['name','الاسم',d.name],['cat','القسم',d.cat],['sku','SKU',d.sku],['cost','سعر التاجر',cost2],['sug','السعر المقترح',sug],['stock','الكمية',stock],['weight','الوزن',wt],['colors','الألوان',d.colors],['sizes','المقاسات',d.sizes],['models','الموديلات',d.models],['warranty','الضمان',d.warranty],['desc','الوصف',d.desc],['usage','التعليمات',d.usage],['returnPolicy','سياسة الإرجاع',d.returnPolicy]].forEach(function(r){ch(r[1],p2[r[0]],r[2]);p2[r[0]]=r[2]});
    if(specs.join('|')!==(p2.specs||[]).join('|')){D.push('المواصفات');p2.specs=specs}
    if(stock>old)db.stockLog.push({ts:Date.now(),pid:p2.id,mc:p2.mc,qty:stock-old,by:me0.name+' (إدارة)'});
    if(d.status&&d.status!==p2.status&&PST[d.status]){ch('الحالة',PST[p2.status],PST[d.status]);p2.status=d.status;p2.lowSince=null}
    checkLow(p2);

    notify(p2.mc,'تم تعديل المنتج «'+p2.name+'» من الإدارة.');audit('product.edit','product:'+p2.id,D.join(' | '));done('تم حفظ المنتج');return;
  }
  if(name==='a-wdedit'){
    if(!need('finance.manage'))return;var w=db.withdrawals.filter(function(x){return x.id===m.id})[0];if(!w)return;
    var amt=Math.round(numv(d.amt));if(!(amt>=1))return setErr('المبلغ غير صحيح.');
    if(!(d.method||'').length||!(d.acct||'').length)return setErr('اكتب الوسيلة ورقم الحساب.');

  }

/* ---------- blacklist / duplicates / fraud ---------- */
function refusalCount(){
  var m={};
  db.orders.forEach(function(o){if(o.status!=='returned')return;if((retReason(o)||'').indexOf('رفض الاستلام')<0)return;
    [o.cust.p1,o.cust.p2].filter(Boolean).forEach(function(p){var x=m[p]||(m[p]={n:0,name:o.cust.name,ts:0,mks:{}});x.n++;x.name=o.cust.name;x.ts=Math.max(x.ts,lastTs(o));x.mks[o.mk]=1})});
  return m;
}
function blackList(){
  var N=db.settings.blackN||2,m=refusalCount(),white=db.white||[],out=[],seen={};
  Object.keys(m).forEach(function(p){if(m[p].n>=N&&white.indexOf(p)<0){seen[p]=1;out.push({p:p,n:m[p].n,auto:true,name:m[p].name,ts:m[p].ts})}});
  (db.black||[]).forEach(function(b){if(!seen[b.p]){seen[b.p]=1;out.push({p:b.p,n:(m[b.p]||{n:0}).n,auto:false,name:b.reason||'',ts:b.ts})}});
  return out;
}
function blackInfo(p){if(!p)return null;return blackList().filter(function(b){return b.p===p})[0]||null}
function chkBlack(o){
  var N=db.settings.blackN||2,m=refusalCount(),white=db.white||[],done={};
  [o.cust.p1,o.cust.p2].filter(Boolean).forEach(function(p){
    if(!m[p]||m[p].n<N||white.indexOf(p)>-1||done[o.mk])return;done[o.mk]=1;
    notify(o.mk,'تنبيه: رقم العميل '+p+' ('+o.cust.name+') رفض استلام '+n(m[p].n)+' طلبات وأصبح في القائمة السوداء. تجنّب تسجيل طلبات جديدة عليه.');
  });
}
function fraudScan(){
  var S=db.settings,now=Date.now(),out={mk:[],mc:[]};
  db.users.forEach(function(u){
    if(u.role==='marketer'){
      var mine=db.orders.filter(function(o){return o.mk===u.id}),d=countBy(mine,['delivered']),r=countBy(mine,['returned']),f=d+r;
      if(f>=S.fraudMin&&r/f>S.fraudRet)out.mk.push({u:u,d:d,r:r,rate:r/f*100});
    }
    if(u.role==='merchant'){
      var late=db.orders.filter(function(o){return o.mc===u.id&&['received','confirming','prepared'].indexOf(o.status)>-1&&now-o.ts>S.lateH*3600000});
      if(late.length)out.mc.push({u:u,late:late,max:Math.max.apply(null,late.map(function(o){return now-o.ts}))});
    }
  });
  out.blk=blackList();out.dup=db.orders.filter(function(o){return o.dup||o.blk});
  return out;
}

async function doReset(role,f){
  var d=fdata(f),email=(d.email||'').toLowerCase(),key='rs:'+email,L=db.lock[key]||{n:0,until:0};
  if(L.until>Date.now())return setErr('محاولات كثيرة. انتظر '+Math.ceil((L.until-Date.now())/1000)+' ثانية.');
  var u=db.users.filter(function(x){return x.email===email&&x.role===role})[0],code=digits(d.code||'').replace(/\D/g,'');
  var rec=u&&(db.resets||[]).filter(function(r){return r.uid===u.id&&!r.used&&r.exp>Date.now()})[0];
  var ok=!!(rec&&code.length===6&&(await hashPw(code,'rs-'+u.id))===rec.h);
  if(!ok){L.n++;if(L.n>=db.settings.maxTries){L.until=Date.now()+db.settings.lockSec*1000;L.n=0}db.lock[key]=L;secLog(email,role,false,'كود استعادة خاطئ');save();return setErr('البريد أو الكود غير صحيح، أو انتهت صلاحية الكود.')}
  if(!pwOk(d.pw))return setErr('كلمة المرور 8 أحرف على الأقل وتحتوي على حروف وأرقام.');

    if(d.cname.length<3)return setErr('اكتب اسم العميل بالكامل.');
    if(!phoneOk(p1))return setErr('رقم هاتف العميل لازم يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون 11 رقم.');
    if(p2&&!phoneOk(p2))return setErr('رقم الهاتف الثاني غير صحيح.');
    if(d.area.length<2||d.street.length<2)return setErr('اكتب المنطقة والشارع.');
    if(qty<1||qty>avail(p))return setErr('الكمية غير متاحة. المتاح '+n(avail(p))+' قطعة.');
    if(price<mkc(p)+db.settings.minProfit)return setErr('سعر البيع لا يمكن أن يقل عن '+n(mkc(p)+db.settings.minProfit)+' ج.م.');
    if(qty>db.settings.maxQty)return setErr('أقصى كمية في الطلب الواحد '+n(db.settings.maxQty)+'.');
    if(GOVS[d.gov]==null)return setErr('الشحن غير متاح لهذه المحافظة حاليًا.');
    var mnote=(d.mnote||'').trim().slice(0,300);
    if(mnote&&(digits(mnote).replace(/\D/g,'').length>=8||/@|https?:|wa\.me|facebook|instagram|واتس/i.test(mnote)))return setErr('الملاحظة للتاجر لا يجب أن تحتوي على أرقام هاتف أو روابط أو حسابات.');
    var wnow=Date.now(),wdup=db.orders.filter(function(x){return x.pid===p.id&&[x.cust.p1,x.cust.p2].indexOf(p1)>-1&&wnow-x.ts<db.settings.dupH*3600000&&['cancelled','rejected','returned'].indexOf(x.status)<0}).length,wbl=blackInfo(p1)||(p2&&blackInfo(p2)),wkey=p.id+'|'+p1;
    if((wdup||wbl)&&!ui.warnOk[wkey]){ui.warnOk[wkey]=true;return setErr((wbl?'تنبيه: رقم العميل ده رفض استلام طلبات قبل كده، واحتمال كبير يرجع الطلب مرتجع. ':'')+(wdup?'تنبيه: نفس رقم العميل طلب نفس المنتج خلال آخر '+n(db.settings.dupH)+' ساعة. ':'')+'لو متأكد اضغط «إنشاء الطلب» مرة تانية للتأكيد.')}
    var o={id:'VX-'+(db.seq.order++),ts:Date.now(),mk:u.id,mc:p.mc,pid:p.id,qty:qty,price:price,cost:mkc(p),mcost:p.cost,fee:frate(u.id),ship:GOVS[d.gov],status:'received',hist:[{s:'received',ts:Date.now()}],cust:{name:d.cname,p1:p1,p2:p2,gov:d.gov,area:d.area,street:d.street,bld:d.bld,floor:d.floor,apt:d.apt,mark:d.mark,det:d.det}};
    o.mnote=mnote;if(wdup)o.dup=true;if(wbl)o.blk=true;ui.warnOk={};db.orders.push(o);if(db.settings.nOrder)notify(p.mc,'تم استلام طلب جديد '+o.id+'.');checkLow(p);ui.draft=null;save();toast('تم تسجيل الطلب '+o.id);location.hash='m-orders';return;
  }
  if(name==='avatar'){
    var af=$('#avf').files[0];if(!af)return setErr('اختر صورة أولًا.');
    if(!/^image\//.test(af.type)||af.size>5*1024*1024)return setErr('الملف لازم يكون صورة أقل من 5 ميجا.');
    fileToUrl(af,240).then(function(url){if(!url)return setErr('تعذّر قراءة الصورة.');u.avatar=url;save();render();toast('تم حفظ صورتك')});return;
  }
  if(name==='withdraw'){
    var W=walletOf(u),amt=parseInt(digits(d.amt),10)||0;
    if(amt<db.settings.minWithdraw)return setErr('الحد الأدنى للسحب '+n(db.settings.minWithdraw)+' ج.م.');
    if(db.settings.maxWithdraw&&amt>db.settings.maxWithdraw)return setErr('الحد الأقصى للسحب '+n(db.settings.maxWithdraw)+' ج.م.');
    if(amt>W.available)return setErr('المبلغ أكبر من رصيدك المتاح ('+n(W.available)+' ج.م).');
    if(digits(d.acct).length<8)return setErr('اكتب رقم الحساب أو المحفظة.');
    var wfe=u.role==='marketer'?Math.round(amt*db.settings.wdFee):0;db.withdrawals.push({id:'WD-'+(90000+db.seq.wd++),uid:u.id,amt:amt,fee:wfe,net:amt-wfe,method:d.method,acct:digits(d.acct),status:'pending',ts:Date.now(),hist:[]});save();toast('تم إرسال طلب السحب — الصافي '+n(amt-wfe)+' ج.م');render();return;
  }
  if(name==='addstock'){
    var sp=prod(f.dataset.pid),q=parseInt(digits(d.q),10)||0;
    if(!sp||sp.mc!==u.id||q<1)return toast('اكتب كمية صحيحة.');
    sp.stock+=q;db.stockLog.push({ts:Date.now(),pid:sp.id,mc:u.id,qty:q,by:u.name});
    if(sp.status==='inactive'&&avail(sp)>lowT())sp.status='published';
    checkLow(sp);save();toast('تمت إضافة الكمية');render();return;
  }
  if(name==='prod'){
    var submit=e.submitter&&e.submitter.dataset.mode==='submit',old=f.dataset.id?prod(f.dataset.id):null;
    var cost=parseInt(digits(d.cost),10)||0,sug=parseInt(digits(d.sug),10)||0,stock=parseInt(digits(d.stock),10);
    if(d.name.length<3)return setErr('اكتب اسم المنتج.');
    if(cost<1)return setErr('اكتب سعر التاجر.');
    if(isNaN(stock)||stock<0)return setErr('اكتب الكمية.');
    if(sug&&sug<mkcOf(cost))return setErr('السعر المقترح لا يمكن أن يقل عن سعر المنتج للمسوّق ('+n(mkcOf(cost))+' ج.م بعد الزيادة التلقائية).');
    if(submit&&u.status!=='approved')return setErr('حسابك قيد المراجعة. احفظ المنتج كمسودة الآن.');
    if(submit&&(d.desc.length<10))return setErr('اكتب وصفًا للمنتج قبل الإرسال.');
    var txtAll=[d.name,d.desc,d.specs,d.colors,d.sizes,d.models,d.warranty].join(' ');
    var idv=[u.store,u.name,u.email,u.phone,u.wa].filter(function(x){return x&&String(x).length>2});
    if(idv.some(function(x){return txtAll.toLowerCase().indexOf(String(x).toLowerCase())>-1})||/01[0125][0-9]{8}/.test(digits(txtAll).replace(/[\s\-]/g,'')))return setErr('لا تكتب اسم متجرك أو رقمك أو بريدك في بيانات المنتج. المنصة تخفي هويتك عن المسوّقين.');
    var file=f.querySelector('#img').files[0],xf=[].slice.call(f.querySelector('#imgs').files).slice(0,4);
    if(xf.some(function(x){return !/^image\//.test(x.type)||x.size>5*1024*1024}))return setErr('الصور الإضافية لازم تكون ملفات صور أقل من 5 ميجا.');
    if(file&&(!/^image\//.test(file.type)||file.size>5*1024*1024))return setErr('الصورة لازم تكون ملف صورة أقل من 5 ميجا.');
    (async function(){
      var img=file?await fileToUrl(file,760):(old?old.img:'');var imgs=xf.length?(await Promise.all(xf.map(function(x){return fileToUrl(x,760)}))).filter(Boolean):(old?(old.imgs||[]):[]);
      var specs=d.specs.split('\n').map(function(x){return x.trim()}).filter(Boolean);
      var np={name:d.name,cat:d.cat,sku:d.sku,cost:cost,sug:sug||Math.round(cost*1.5),stock:stock,weight:parseFloat(digits(d.weight))||0,colors:d.colors,sizes:d.sizes,models:d.models,warranty:d.warranty,desc:d.desc,specs:specs,usage:d.usage,returnPolicy:d.returnPolicy,img:img,imgs:imgs};
      if(old){
        var sens=old.cost!==np.cost||old.desc!==np.desc||old.specs.join('|')!==np.specs.join('|')||old.returnPolicy!==np.returnPolicy||old.weight!==np.weight||old.img!==np.img||(old.imgs||[]).length!==np.imgs.length;
        Object.keys(np).forEach(function(k){old[k]=np[k]});
        if(old.status==='published'&&sens&&db.settings.reviewEdits){old.status='pending';old.edited=true;toast('التعديل جوهري. المنتج رجع للمراجعة.')}
        else if(submit&&(old.status==='draft'||old.status==='rejected'||old.status==='changes')){old.status='pending';toast('تم إرسال المنتج للمراجعة')}
        else toast('تم حفظ التعديلات');
        checkLow(old);
      }else{
        np.id=db.seq.product++;np.mc=u.id;np.status=submit?'pending':'draft';np.views=0;np.created=Date.now();np.lowSince=null;
        db.products.push(np);toast(submit?'تم إرسال المنتج للمراجعة':'تم حفظ المسودة');
      }
      save();location.hash='t-products';
    })();
  }
});
function fileToUrl(file,mx){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,(mx||480)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=function(){res('')};im.src=fr.result};fr.onerror=function(){res('')};fr.readAsDataURL(file)})}

window.addEventListener('hashchange',function(){ui.amodal=null;ui.abell=false;render()});
window.addEventListener('scroll',function(){var p=$('#prog');if(!p)return;var h=document.documentElement.scrollHeight-innerHeight;p.style.width=(h>0?window.scrollY/h*100:0)+'%'},{passive:true});
document.addEventListener('pointermove',function(e){var h=$('.hero');if(!h)return;var r=h.getBoundingClientRect();h.style.setProperty('--mx',(e.clientX-r.left)+'px');h.style.setProperty('--my',(e.clientY-r.top)+'px')});
setInterval(function(){var u=me();if(u&&u.role==='admin'&&db.asid&&/^#(a-|admin)/.test(location.hash)){var s=curSess();if(!s||Date.now()-s.last>db.settings.sessMin*60000)endSession('انتهت الجلسة بسبب عدم النشاط.')}},30000);
syncCfg();sweep();chSweep();render();
})();
</script>
