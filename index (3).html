<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VETREX</title>
<meta name="theme-color" content="#0A0B0C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Chakra+Petch:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: dark single-look. Landing (hero with animated graph canvas, flow, role cards) + auth + app shell (right sidebar, content) for marketer and merchant. */
:root{color-scheme:dark;
  --bg:#0A0B0C;--bg2:#0F1113;--surface:#14171A;--surface2:#1B1F23;--line:#2A3035;--line2:#3A4147;
  --metal:#9AA3AB;--ink:#F2F4F5;--red:#C8202C;--red-hi:#F0505B;--red-deep:#4A0D13;
  --good:#3DCB8A;--warn:#F2B84B;--blue:#6AA4FF;--good-t:#3DCB8A;--warn-t:#F2B84B;--acc:#F0505B;--acc2:#FF7A83;
  --f-ar:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-disp:'Cairo','Tajawal',system-ui,sans-serif;
  --f-lat:'Chakra Petch','Tajawal',system-ui,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--f-ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-lat);letter-spacing:.04em}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{overflow-x:auto;max-width:100%}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:11px 22px;font-weight:600;border:1px solid transparent;text-decoration:none;background:var(--surface2);color:var(--ink);line-height:1.4}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#DA2B38}
.btn.line{background:transparent;border-color:var(--line2)}
.btn.line:hover{border-color:var(--metal)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.big{padding:14px 28px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);width:40px;height:40px;display:grid;place-items:center}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;color:var(--metal);font-weight:500}
.f>span i{color:var(--red-hi);font-style:normal;margin-inline-start:4px}
.f small{color:var(--metal);font-size:12px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--red-hi);outline:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
input[type=file]{padding:8px}
textarea{resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--metal) 50%),linear-gradient(135deg,var(--metal) 50%,transparent 50%);background-position:calc(0% + 18px) 52%,calc(0% + 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .wide{grid-column:1/-1}
.err{color:var(--red-hi);font-size:13px;min-height:1.3em}
.chk{display:flex;align-items:center;gap:10px}

/* landing */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,11,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.logo b{font-family:var(--f-lat);font-weight:800;font-size:20px;letter-spacing:.12em}
.logo b em{color:var(--red-hi);font-style:normal}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 12px;color:var(--metal);text-decoration:none;border-radius:var(--r);font-weight:500;cursor:pointer}
.nav-links a:hover{color:var(--ink)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding-block:64px 72px}
.eyebrow{font-family:var(--f-lat);font-size:12px;letter-spacing:.32em;color:var(--red-hi);font-weight:700}
.hero h1{font-size:clamp(34px,5.6vw,64px);margin-top:14px;line-height:1.2}
.hero h1 span{color:var(--red-hi)}
.hero .lead{color:var(--metal);font-size:18px;margin-top:18px;max-width:30em}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .tag{margin-top:20px;color:var(--metal);font-size:14px}
.vis{position:relative;min-width:0}
.vis img{display:block;width:100%;height:auto;border-radius:var(--r);-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%)}
.vis::before{content:"";position:absolute;inset:12% 18%;background:radial-gradient(circle,rgba(200,32,44,.38),transparent 68%);filter:blur(20px)}
.fc{position:absolute;background:rgba(20,23,26,.92);border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;min-width:132px;backdrop-filter:blur(6px);animation:flt 7s ease-in-out infinite}
.fc small{display:block;color:var(--metal);font-size:12px}
.fc b{font-family:var(--f-lat);font-size:19px}
.fc b.up{color:var(--good-t)}
.fc em{display:inline-block;font-style:normal;font-size:10.5px;border:1px dashed var(--line2);border-radius:99px;padding:0 8px;color:var(--metal);margin-top:2px}
.fc svg{display:block;width:100%;height:24px;margin-top:4px}
.fc path{fill:none;stroke:var(--red-hi);stroke-width:2;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:dr 2.4s .4s ease forwards}
.fc1{top:0;inset-inline-start:-2%}
.fc2{top:4%;inset-inline-end:-2%;animation-delay:-2s}
.fc3{bottom:-14%;inset-inline-end:22%;animation-delay:-4s}
@keyframes flt{50%{transform:translateY(-8px)}}
@keyframes dr{to{stroke-dashoffset:0}}
section.sec{padding-block:72px}
.sec-h{max-width:640px;margin-bottom:32px}
.sec-h h2{font-size:clamp(26px,3.6vw,38px)}
.sec-h p{color:var(--metal);margin-top:10px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.flow>div{position:relative;padding:20px 18px 22px;border:1px solid var(--line);background:var(--surface);margin-inline-start:-1px}
.flow>div:first-child{border-start-start-radius:var(--r);border-end-start-radius:var(--r);margin-inline-start:0}
.flow>div:last-child{border-start-end-radius:var(--r);border-end-end-radius:var(--r)}
.flow b{font-family:var(--f-lat);color:var(--red-hi);font-size:13px;letter-spacing:.2em}
.flow h3{font-size:18px;margin:8px 0 6px}
.flow p{color:var(--metal);font-size:14px}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.role.hot{border-color:var(--red);background:linear-gradient(180deg,rgba(200,32,44,.12),var(--surface) 55%)}
.role h3{font-size:26px}
.role ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--metal)}
.role li{padding-inline-start:20px;position:relative}
.role li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:8px;height:2px;background:var(--red-hi)}
.role .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.sec2{background:var(--bg2);border-block:1px solid var(--line)}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.layer{border-top:2px solid var(--red);padding:14px 0 0;min-width:0}
.layer h4{font-size:16px}
.layer p{color:var(--metal);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:6px 16px;color:var(--metal);background:transparent;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta-band{background:linear-gradient(120deg,var(--red-deep),var(--bg2) 70%);border:1px solid var(--line);border-radius:var(--r);padding:40px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer.ft{border-top:1px solid var(--line);padding-block:28px;color:var(--metal);font-size:13px}
footer.ft .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.auth-side{background:radial-gradient(circle at 30% 30%,#2a0a0e,var(--bg) 70%);padding:40px max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:20px;border-inline-end:1px solid var(--line)}
.auth-side p{color:var(--metal);max-width:26em}
.auth-main{padding:40px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:560px;display:grid;gap:18px}
.auth-card h1{font-size:30px}
.auth-card .sub{color:var(--metal)}
.alt{color:var(--metal);font-size:14px}
.alt a{color:var(--red-hi);font-weight:600;text-decoration:none}
.demo{border:1px dashed var(--line2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--metal);font-size:14px}

/* app shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--bg2);border-inline-end:1px solid var(--line);padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;overflow:auto}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.sbrand b{font-family:var(--f-lat);font-weight:800;letter-spacing:.12em;display:block;line-height:1.2}
.sbrand small{font-family:var(--f-lat);font-size:10px;letter-spacing:.24em;color:var(--red-hi)}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--metal);text-decoration:none;font-weight:500}
.side nav a:hover{background:var(--surface);color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--surface2);color:var(--ink);box-shadow:inset -3px 0 0 var(--red)}
.side nav a .bd{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding-inline:6px}
.suser{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px;font-size:14px}
.suser small{color:var(--metal)}
.suser .btn{margin-top:8px}
.main{min-width:0}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;background:rgba(10,11,12,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);min-height:64px;padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tbar h1{font-size:22px;margin-inline-end:auto}
.tbar .logo{margin-inline-end:0}
.tbar .menu{display:none}
.content{padding-block:24px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:24px;max-width:1180px}
.scrim{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:18px;margin-bottom:12px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card .hd h3{margin:0}
.grp{display:grid;gap:10px}
.grp>h4{font-size:14px;color:var(--metal);font-family:var(--f-ar);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats[data-c="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats[data-c="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats[data-c="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats[data-c="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.st small{display:block;color:var(--metal);font-size:13px}
.st b{font-family:var(--f-lat);font-size:22px;font-weight:700;display:block;margin-top:2px;overflow-wrap:anywhere}
.st b small{display:inline;font-family:var(--f-ar);font-size:12px;color:var(--metal);font-weight:400}
.st.red{border-color:var(--red);background:linear-gradient(180deg,rgba(200,32,44,.16),var(--surface))}
.st.good b{color:var(--good-t)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line2);color:var(--metal);border-radius:var(--r);padding:4px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--metal);font-size:11px;font-family:var(--f-lat)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--red-hi);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--bg);stroke:var(--red-hi);stroke-width:2}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;color:var(--metal);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.7}
.p-received,.p-pending,.p-confirming{color:var(--warn-t)}
.p-prepared,.p-out{color:var(--blue)}
.p-delivered,.p-published,.p-approved,.p-excellent{color:var(--good-t)}
.p-rejected,.p-returned,.p-low{color:var(--red-hi)}
.p-draft,.p-inactive{color:var(--metal)}
.p-good{color:var(--warn-t)}
.tile{border-radius:var(--r);background:var(--surface2);display:grid;place-items:center;color:var(--red-hi);overflow:hidden;aspect-ratio:4/3;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ic{width:36px;height:36px}
.tile.s{width:48px;aspect-ratio:1;flex:none}
.tile.s .ic{width:22px;height:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
.pc:hover{border-color:var(--line2)}
.pc h3{font-family:var(--f-ar);font-size:15px;font-weight:600}
.pc .cat{color:var(--metal);font-size:12px}
.pc .pr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.pc .pr div{background:var(--bg2);border-radius:var(--r);padding:4px 10px}
.pc .pr small{display:block;font-size:11px;color:var(--metal)}
.pc .pr b{font-size:14px}
.pc .pr .gn b{color:var(--good-t)}
.score{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-lat);font-weight:700;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .f{min-width:150px;flex:1}
.pd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--metal)}.kv dd{margin:0}
.sum{display:grid;gap:8px}
.sum .r{display:flex;justify-content:space-between;gap:12px}
.sum .r.t{border-top:1px dashed var(--line2);padding-top:8px;font-weight:700}
.sum .r.g{background:rgba(61,203,138,.12);color:var(--good-t);border-radius:var(--r);padding:8px 12px;font-weight:700}
.ord{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord .m{color:var(--metal);font-size:13px}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 24px 16px 0;color:var(--metal)}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--red-hi)}
.tl li::after{content:"";position:absolute;inset-inline-start:4px;top:18px;bottom:-6px;width:2px;background:var(--line2)}
.tl li:last-child::after{display:none}
.tl li b{color:var(--ink);display:block}
.empty{color:var(--metal);text-align:center;padding:36px 12px}
.note{background:rgba(242,184,75,.1);border:1px solid rgba(242,184,75,.35);color:var(--warn-t);border-radius:var(--r);padding:12px 16px;font-size:14px}
.note.info{background:rgba(106,164,255,.08);border-color:rgba(106,164,255,.3);color:var(--blue)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.mbox .hd{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;place-items:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.code{font-family:var(--f-lat);font-weight:700;letter-spacing:.1em;background:var(--bg2);border:1px dashed var(--line2);border-radius:var(--r);padding:8px 14px;display:inline-block}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.inl{display:flex;gap:8px;align-items:center}
.inl input{width:80px}

/* landing v2 */
.mut{color:var(--metal)}
.hero h1 span{color:var(--red-hi);background:linear-gradient(90deg,#FF7A83,#C8202C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.trust{display:flex;gap:18px;flex-wrap:wrap;list-style:none;margin:26px 0 0;padding:0;color:var(--metal);font-size:14px}
.trust li{display:flex;align-items:center;gap:8px}
.trust li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(61,203,138,.18)}
.vis2{position:relative;min-width:0;display:grid;gap:0}
.vis2 .lg{display:block;width:100%;height:auto;border-radius:var(--r);-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 52%,transparent 100%)}
.vis2::before{content:"";position:absolute;inset:0 10% 30%;background:radial-gradient(circle,rgba(200,32,44,.4),transparent 68%);filter:blur(24px)}
.gl{background:linear-gradient(160deg,rgba(32,36,40,.94),rgba(15,17,19,.94));border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 30px 80px -30px rgba(200,32,44,.55),inset 0 0 0 1px rgba(255,255,255,.03);backdrop-filter:blur(8px)}

function dt(s){try{return new Date(s).toLocaleDateString('en-GB')}catch(e){return ''}}
function sid(id){return '#'+String(id).slice(0,6).toUpperCase()}
function $(s,r){return (r||document).querySelector(s)}
function toast(m){var t=$('#toast');t.innerHTML='<div>'+esc(m)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(function(){t.innerHTML=''},3500)}
var ERR={'below minimum':'المبلغ أقل من الحد الأدنى للسحب','insufficient balance':'المبلغ أكبر من رصيدك المتاح','price below cost':'سعر البيع أقل من التكلفة','product unavailable':'المنتج غير متاح أو الكمية أكبر من المخزون','not allowed':'غير مسموح لك بهذا الإجراء','closed':'الطلب مغلق ولا يمكن تغييره','bad qty':'الكمية غير صحيحة','Invalid login credentials':'البريد أو كلمة المرور غير صحيحة','User already registered':'هذا البريد مسجّل بالفعل','Email not confirmed':'لازم تأكّد بريدك من الرسالة اللي وصلتك'};
function em(e){var m=(e&&e.message)||String(e||'');for(var k in ERR){if(m.indexOf(k)>-1)return ERR[k]}return 'حصل خطأ: '+m}
async function q(p){var r=await p;if(r.error)throw r.error;return r.data}
function pill(s,t){var T={confirming:'بانتظار التأكيد',out:'خرج للتوصيل',delivered:'تم التسليم',returned:'مرتجع',cancelled:'ملغي',pending:'قيد المراجعة',approved:'مفعّل',banned:'موقوف',rejected:'مرفوض',hidden:'مخفي',paid:'تم التحويل'};return '<span class="pill s-'+s+'">'+esc(t||T[s]||s)+'</span>'}
function fld(name,label,o){o=o||{};var t=o.type||'text',c=o.wide?' wide':'',r=o.req?'<i>*</i>':'';var inp;
 if(t==='select')inp='<select name="'+name+'">'+(o.opts||[]).map(function(x){return '<option'+(x===o.val?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>';
 else if(t==='textarea')inp='<textarea name="'+name+'" rows="'+(o.rows||3)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(o.val||'')+'</textarea>';
 else inp='<input name="'+name+'" type="'+t+'"'+(o.val!=null?' value="'+esc(o.val)+'"':'')+(o.min!=null?' min="'+o.min+'"':'')+(o.max!=null?' max="'+o.max+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.ac?' autocomplete="'+o.ac+'"':'')+(o.im?' inputmode="'+o.im+'"':'')+(o.accept?' accept="'+o.accept+'"':'')+(o.multiple?' multiple':'')+(t==='email'?' dir="ltr"':'')+'>';
 return '<label class="f'+c+'"><span>'+esc(label)+r+'</span>'+inp+(o.hint?'<small>'+esc(o.hint)+'</small>':'')+'</label>'}
function fdata(form){var o={};Array.prototype.forEach.call(form.elements,function(e){if(e.name&&e.type!=='file')o[e.name]=e.value.trim()});return o}
function validPhone(p){return /^01[0125]\d{8}$/.test(digits(p).replace(/[\s-]/g,''))}
function validPw(p){return p.length>=8&&/[A-Za-z؀-ۿ]/.test(p)&&/\d/.test(p)}
function setErr(form,msg){var e=$('.err',form);if(e)e.textContent=msg||''}
function busy(form,on){Array.prototype.forEach.call(form.querySelectorAll('button[type=submit]'),function(b){b.disabled=on})}

function shell(title,html){
 var r=route(),items=NAV[S.me.role].map(function(x){var on=r===x[0]||(x[0].length>3&&r.indexOf(x[0])===0);return '<a href="#'+x[0]+'"'+(on?' aria-current="page"':'')+'>'+esc(x[1])+'</a>'}).join('');

 return '<div class="shell"><aside class="side"><div class="sbrand"><div><b>VETREX</b><small>'+RN[S.me.role]+'</small></div></div><nav>'+items+'<button data-act="logout" type="button">تسجيل الخروج</button></nav><div class="suser"><b>'+esc(S.me.name)+'</b><small dir="ltr">'+esc(S.me.email||'')+'</small></div></aside><main class="main"><div class="tbar"><h1>'+esc(title)+'</h1><button class="btn line sm" data-act="refresh" type="button">تحديث</button></div><div class="content" id="view">'+html+'</div></main></div>'}

async function render(){
 var my=++S.seq,r=route();
 try{
  var pub=['/','/login','/reg/marketer','/reg/merchant'];
  if(!S.me){ root.innerHTML=pubPage(r); window.scrollTo(0,0); return }
  if(S.me.status==='banned'){root.innerHTML=notice('حسابك موقوف','تواصل مع الدعم لو شايف إن ده حصل بالغلط.');return}
  if(S.me.role==='merchant'&&S.me.status==='pending'){root.innerHTML=notice('حسابك قيد المراجعة','فريق VETREX بيراجع بياناتك وهيتم تفعيل حسابك قريبًا. تقدر ترجع تدخل بعد التفعيل.');return}
  var base={marketer:'/m',merchant:'/t',admin:'/a'}[S.me.role];
  if(pub.indexOf(r)>-1||r.indexOf(base)!==0){location.hash='#'+base;return}
  root.innerHTML=shell('',  '<div class="loading">جاري التحميل…</div>');
  var v=await viewFor(r);
  if(my!==S.seq)return;
  root.innerHTML=shell(v.title,v.html);
 }catch(e){ if(my===S.seq){root.innerHTML=S.me?shell('خطأ','<div class="card"><p class="err">'+esc(em(e))+'</p></div>'):notice('خطأ',em(e))} }
}
function notice(t,m){return '<div class="auth-main" style="min-height:100vh"><div class="auth-card card"><h1>'+esc(t)+'</h1><p class="sub">'+esc(m)+'</p><button class="btn line" data-act="logout" type="button">تسجيل الخروج</button></div></div>'}

}

   if(!validPhone(d.phone))throw new Error('رقم الموبايل غير صحيح');
   if(!/^\S+@\S+\.\S+$/.test(d.email))throw new Error('البريد الإلكتروني غير صحيح');
   if(!validPw(d.pw))throw new Error('كلمة المرور 8 أحرف على الأقل وتحتوي على حروف وأرقام');
   if(d.pw!==d.pw2)throw new Error('كلمتا المرور غير متطابقتين');
   var r=await q(sb.auth.signUp({email:d.email,password:d.pw,options:{data:{role:role,name:d.name,phone:digits(d.phone),store:d.store||''}}}));
   if(!r.session){root.innerHTML=notice('تم إنشاء الحساب','بعتنا لك رسالة على بريدك. افتحها واضغط على رابط التأكيد وبعدها سجّل دخول.');return}
   await loadMe();await loadSettings();location.hash='#/';render();return}
  if(k==='order'){
   var cost=Number(f.dataset.cost),qty=parseInt(digits(d.qty),10),price=parseInt(digits(d.price),10);
   if(!(qty>=1&&qty<=50))throw new Error('الكمية غير صحيحة');
   if(!(price>=cost))throw new Error('سعر البيع لازم يكون '+n(cost)+' ج.م أو أكتر');
   if(!d.cname||d.cname.length<2)throw new Error('اكتب اسم العميل');
   if(!validPhone(d.cphone))throw new Error('رقم موبايل العميل غير صحيح');
   if(!d.gov||!d.addr||d.addr.length<8)throw new Error('اكتب المحافظة والعنوان بالتفصيل');
   await q(sb.rpc('create_order',{p_product:f.dataset.pid,p_qty:qty,p_price:price,p_name:d.cname,p_phone:digits(d.cphone),p_addr:d.gov+' - '+d.addr}));
   toast('تم تسجيل الطلب');location.hash='#/m/orders';return}
  if(k==='withdraw'){
   var amt=parseInt(digits(d.amt),10)||0;
   if(amt<S.settings.minWithdraw)throw new Error('أقل مبلغ للسحب '+n(S.settings.minWithdraw)+' ج.م');
   if(!d.acct||digits(d.acct).replace(/\D/g,'').length<8)throw new Error('اكتب رقم الحساب أو المحفظة صح');
   await q(sb.rpc('request_withdrawal',{p_amount:amt,p_method:d.method,p_account:digits(d.acct)}));
   toast('تم إرسال طلب السحب');render();return}
  if(k==='prod'){
   if(!d.name||d.name.length<2)throw new Error('اكتب اسم المنتج');
   var mc=parseInt(digits(d.mcost),10),sk=parseInt(digits(d.stock),10);
   if(!(mc>=1))throw new Error('اكتب السعر');if(!(sk>=1))throw new Error('اكتب الكمية');
   var lk=textLeak(d.name+' '+d.desc);if(lk)throw new Error(lk+'. المنصة تخفي هويتك عن المسوّقين.');
   var files=Array.prototype.slice.call(f.elements.imgs.files||[],0,4);
   if(!files.length)throw new Error('ضيف صورة واحدة على الأقل');
   var urls=[];
   for(var i=0;i<files.length;i++){var b=await compress(files[i]);var path=S.me.id+'/'+uuid()+(b.type==='image/webp'?'.webp':'.jpg');
    var up=await sb.storage.from('product-images').upload(path,b,{contentType:b.type,upsert:false});if(up.error)throw up.error;
    urls.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl)}
   await q(sb.from('products').insert({merchant_id:S.me.id,name:d.name,description:d.desc,category:d.category,mcost:mc,stock:sk,images:urls}));
   toast('تم إرسال المنتج للمراجعة');render();return}
  if(k==='addstock'){var qq=parseInt(digits(d.q),10);if(!(qq>=1))throw new Error('اكتب كمية صحيحة');await q(sb.rpc('merchant_add_stock',{p_product:f.dataset.pid,p_qty:qq}));toast('تمت إضافة المخزون');render();return}
  if(k==='ret'){await q(sb.rpc('set_order_status',{p_order:f.dataset.id,p_status:'returned',p_reason:d.reason}));var m=$('.modal');if(m)m.remove();toast('تم تسجيل المرتجع');render();return}
  if(k==='settings'){
   var pf=Number(digits(d.platformFee)),wf=Number(digits(d.wdFee)),mw=Number(digits(d.minWithdraw));
   if(!(pf>=0&&pf<=50&&wf>=0&&wf<=50&&mw>=1))throw new Error('راجع الأرقام');
   await q(sb.rpc('admin_set_setting',{p_key:'platformFee',p_val:pf/100}));await q(sb.rpc('admin_set_setting',{p_key:'wdFee',p_val:wf/100}));await q(sb.rpc('admin_set_setting',{p_key:'minWithdraw',p_val:mw}));
   await loadSettings();toast('تم الحفظ');render();return}
 }catch(err){setErr(f,em(err))}
 finally{busy(f,false)}
});
// psum initial after render
new MutationObserver(function(){var f=$('form[data-form="order"]');if(f&&!f.dataset.init){f.dataset.init=1;psum(f)}}).observe(root,{childList:true,subtree:true});

/* ---------- boot ---------- */
(async function(){
 try{await loadMe();if(S.me)await loadSettings()}catch(e){S.me=null}
 render();
})();
})();
</script>
</body>
</html>
